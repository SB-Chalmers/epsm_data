name: Data release checks

on:
  push:
    branches: [dev, main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        dependencies: ['pinned', 'dev']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_core
          ssh-key: ${{ secrets.EPSM_CORE_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.dependencies == 'dev' && 'dev' || 'ad2e031c180462678abe8c3edc783feb112e0849' }}
          path: .ci/epsm_core
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_lca
          ssh-key: ${{ secrets.EPSM_LCA_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.dependencies == 'dev' && 'dev' || 'da0485906bec233fe1c9a9a95d5b6c66a2f74d5b' }}
          path: .ci/epsm_lca
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm
          ssh-key: ${{ secrets.EPSM_REPO_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.dependencies == 'dev' && 'dev' || '7e9c1dc3d39c557fec1285740568d397c9cc8ac6' }}
          path: .ci/epsm
      - name: Install test and build tools
        run: python -m pip install '.[dev,visualization]' .ci/epsm_core .ci/epsm_lca .ci/epsm
      - name: Run full package suite
        run: python -m pytest -q -o pythonpath=.
      - name: Build and check installed wheel
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall dist/epsm_data-*.whl
          python -m pip check
          cd /tmp
          python -c 'from epsm_data import Catalogue; print(Catalogue)'
