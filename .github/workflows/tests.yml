name: Release verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standalone library and verification tools
        run: python -m pip install '.[dev,visualization,geography]'
      - name: Check source and public behavior
        run: |
          python -m ruff check src tests examples
          python -m pytest -q
      - name: Build and inspect installed wheel
        run: |
          python -m build
          python -m pip install --force-reinstall dist/epsm_data-*.whl
          python -m pip check
          cd /tmp
          python -c 'from epsm_data import Catalogue, load_sanity_fixture; c=Catalogue.load(); assert len(c.ids()) == 28; assert len(c.search()) == 228; assert len(load_sanity_fixture()["nonresidential_construction"]["period_screens"]) == 7; print(c.sanity_report()["summary"])'
