name: Data release checks

on:
  push:
    branches: [dev, main, 'codex/release-ci-data']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and build tools
        run: python -m pip install '.[dev,visualization]'
      - name: Run full package suite
        run: python -m pytest -q
      - name: Build and check installed wheel
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall dist/epsm_data-*.whl
          python -m pip check
          cd /tmp
          python -c 'from epsm_data import Catalogue; print(Catalogue)'
