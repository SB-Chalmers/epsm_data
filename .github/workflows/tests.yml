name: LoD2 library verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install standalone library and verification tools
        run: python -m pip install '.[dev,visualization]'
      - name: Check source and public behavior
        run: |
          python -m ruff check src tests explorer examples
          python -m pytest -q
      - name: Build and inspect installed wheel
        run: |
          python -m build
          python -m pip install --force-reinstall dist/epsm_data-*.whl
          python -m pip check
          cd /tmp
          python -c 'from epsm_data import Catalogue; c=Catalogue.load(); assert len(c.ids()) == 28; assert len(c.search()) == 228; print(c.summary())'
