name: Development checks
'on':
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
    - name: Install development prerequisites
      run: python -m pip install '.[dev]'
    - name: Run offline development checks
      run: |
        python -m ruff check src tests examples
        python -m pytest -q
        python -m build --wheel
    - name: Report current catalogue findings
      run: python -m epsm_data.cli --sanity > catalogue-sanity-report.json
    - uses: actions/upload-artifact@v4
      with:
        name: catalogue-sanity-report
        path: catalogue-sanity-report.json
