[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epsm_data"
dynamic = ["version"]
description = "Building archetype data library for energy performance and stock modelling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
visualization = ["matplotlib>=3.9,<4", "networkx>=3,<4", "pyvis>=0.3,<1"]
dev = ["pytest>=8", "ruff>=0.11", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["epsm_data*"]

[project.scripts]
epsm-matrix-audit = "epsm_data.matrix_audit:main"

[tool.setuptools.package-data]
"epsm_data.datasets.parametric" = ["*.json"]
"epsm_data.datasets.standards" = ["*.json"]
"epsm_data.datasets.layered" = ["*.json", "evidence/*.json"]

[tool.setuptools.dynamic]
version = {attr = "epsm_data._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
extend-exclude = ["ARCHIVE", "archive", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
