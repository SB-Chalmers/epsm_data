[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
license = "MIT"
license-files = ["LICENSE"]
name = "epsm_data"
dynamic = ["version"]
description = "Building archetype data library for energy performance and stock modelling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
geography = ["geopandas>=1.0,<2"]
visualization = ["matplotlib>=3.9,<4"]
dev = ["pytest>=8", "ruff>=0.11", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["epsm_data*"]

[project.scripts]
epsm-catalogue = "epsm_data.cli:main"

[tool.setuptools.package-data]
"epsm_data.datasets.standards" = ["*.json"]
"epsm_data.datasets.lod2" = ["*.json"]
"epsm_data.datasets.sanity" = ["*.json"]
"epsm_data.datasets.climate_zones" = ["*.json", "*.json.gz"]
"epsm_data.datasets.sources" = ["*.json", "LICENSE-*.txt"]

[tool.setuptools.dynamic]
version = {attr = "epsm_data._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
extend-exclude = ["evidence", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
