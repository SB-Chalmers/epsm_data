[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epsm_data"
version = "0.1.0"
description = "Building archetype data library for energy performance and stock modelling"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "requests>=2.28",
    "certifi>=2023.0",
    "sqlalchemy>=2.0",
    "networkx>=3.0",
    "pyvis>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["epsm_data*"]
